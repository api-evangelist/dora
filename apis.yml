aid: dora
name: Dora
description: Dora (Hola Dora) is a Colombian proptech and fintech startup, founded
  in 2023 and headquartered in Bogota, that acts as a rental guarantee for the residential
  real-estate market. It underwrites tenants in roughly five minutes over WhatsApp
  with no guarantor or co-signer, generates a digitally signed lease, and then guarantees
  the rent to landlords and property managers by paying the monthly amount on a fixed
  day whether or not the tenant has paid. Its InvestigaDora, ContrataDora and GarantizaDora
  flows cover tenant screening, electronic contracting, and guaranteed collection,
  reconciliation and payout for real-estate operators.
